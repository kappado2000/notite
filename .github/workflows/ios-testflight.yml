name: iOS TestFlight build

on:
  workflow_dispatch: {}
  # Verificare săptămânală (luni, 06:00 UTC): build nou doar dacă ultimul
  # build TestFlight expiră în mai puțin de 21 de zile (expiră la 90).
  # Acord explicit al userului pentru aceste build-uri automate: 2026-10-28.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      build: ${{ steps.expiry.outputs.build }}
    steps:
      # GitHub oprește workflow-urile programate după 60 de zile fără
      # activitate în repo; reactivarea le ține pornite.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ios-testflight.yml/enable"

      - name: Days until the latest TestFlight build expires
        id: expiry
        env:
          APP_ID: '6825868503'
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pip install --quiet pyjwt cryptography
          python3 - << 'PY'
          import base64, json, os, time, urllib.request
          from datetime import datetime, timezone
          import jwt
          now = int(time.time())
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600,
               'aud': 'appstoreconnect-v1'},
              base64.b64decode(os.environ['ASC_API_KEY_BASE64']),
              algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})
          url = ('https://api.appstoreconnect.apple.com/v1/builds'
                 f"?filter[app]={os.environ['APP_ID']}&sort=-uploadedDate&limit=10"
                 '&fields[builds]=version,processingState,expirationDate,expired')
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
          builds = json.load(urllib.request.urlopen(req))['data']
          valid = [b['attributes'] for b in builds
                   if b['attributes']['processingState'] == 'VALID'
                   and not b['attributes']['expired']]
          if not valid:
              days = -1
          else:
              exp = datetime.fromisoformat(valid[0]['expirationDate'])
              days = (exp - datetime.now(timezone.utc)).days
          print(f'Ultimul build valid expiră în {days} zile.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"build={'true' if days < 21 else 'false'}\n")
          PY

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Certificatul de distribuție intră într-un keychain temporar, care
      # există doar cât rulează build-ul; profilul App Store merge unde îl
      # caută Xcode.
      - name: Import signing certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          echo -n "$APP_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/notite.mobileprovision"

      - name: Write export options plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>FUR5C9CYR8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kappado.notite</key>
              <string>Notite App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # Numărul de build crește la fiecare rulare (TestFlight refuză dubluri).
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      # Fără release public: repo-ul e public, IPA-ul merge doar în TestFlight.
      # Autentificare cu cheia API (fără 2FA), deci merge fără om.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect" || true
