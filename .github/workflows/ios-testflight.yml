name: iOS TestFlight build

on:
  workflow_dispatch: {}
  # Verificare săptămânală (luni, 06:00 UTC): build nou doar dacă ultimul
  # build TestFlight expiră în mai puțin de 21 de zile (expiră la 90).
  # Acord explicit al userului pentru aceste build-uri automate: 2026-10-28.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      build: ${{ steps.expiry.outputs.build }}
      name: ${{ steps.expiry.outputs.name }}
    steps:
      # GitHub oprește workflow-urile programate după 60 de zile fără
      # activitate în repo; reactivarea le ține pornite.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ios-testflight.yml/enable"

      - uses: actions/checkout@v4

      - name: Days until the latest TestFlight build expires
        id: expiry
        env:
          APP_ID: '6825868503'
          EVENT: ${{ github.event_name }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 - << 'PY'
          import base64, json, os, re, time, urllib.request
          from datetime import datetime, timezone
          import jwt

          # Stări în care trenul versiunii e închis: Apple refuză upload-ul
          # cu „Pre-Release Train closed” dacă versiunea nu e mai mare.
          APPROVED = {
              'ACCEPTED', 'PENDING_DEVELOPER_RELEASE', 'PROCESSING_FOR_DISTRIBUTION',
              'READY_FOR_DISTRIBUTION', 'REPLACED_WITH_NEW_VERSION', 'READY_FOR_SALE',
              'PROCESSING_FOR_APP_STORE', 'PENDING_APPLE_RELEASE', 'REMOVED_FROM_SALE',
              'DEVELOPER_REMOVED_FROM_SALE',
          }

          def key(v):
              parts = [int(x) for x in v.split('.')]
              return tuple(parts + [0] * (3 - len(parts)))

          now = int(time.time())
          token = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600,
               'aud': 'appstoreconnect-v1'},
              base64.b64decode(os.environ['ASC_API_KEY_BASE64']),
              algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})

          def get(path):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com' + path,
                                           headers={'Authorization': f'Bearer {token}'})
              return json.load(urllib.request.urlopen(req))['data']

          scheduled = os.environ['EVENT'] == 'schedule'
          version = re.search(r'^version:\s*([0-9.]+)', open('pubspec.yaml').read(), re.M).group(1)
          try:
              builds = get(f"/v1/builds?filter[app]={os.environ['APP_ID']}&sort=-uploadedDate&limit=10"
                           '&fields[builds]=version,processingState,expirationDate,expired')
              valid = [b['attributes'] for b in builds
                       if b['attributes']['processingState'] == 'VALID'
                       and not b['attributes']['expired']]
              if not valid:
                  days = -1
              else:
                  exp = datetime.fromisoformat(valid[0]['expirationDate'])
                  days = (exp - datetime.now(timezone.utc)).days
              print(f'Ultimul build valid expiră în {days} zile.')

              # Reînnoirile automate nu modifică pubspec-ul, deci după prima
              # aprobare App Store ar fi refuzate. Build-ul primește atunci
              # versiunea aprobată + 1 la patch (doar în CI, fără commit).
              versions = [v['attributes'] for v in get(
                  f"/v1/apps/{os.environ['APP_ID']}/appStoreVersions?filter[platform]=IOS&limit=200"
                  '&fields[appStoreVersions]=versionString,appStoreState,appVersionState')]
              approved = [v['versionString'] for v in versions
                          if v.get('appVersionState') in APPROVED or v.get('appStoreState') in APPROVED]
              latest = max(approved, key=key) if approved else None
              name = version
              if latest and key(version) <= key(latest):
                  major, minor, patch = key(latest)[:3]
                  name = f'{major}.{minor}.{patch + 1}'
                  print(f'::warning::Versiunea {version} din pubspec e închisă la Apple (ultima aprobată: '
                        f'{latest}); build-ul folosește {name}. Crește versiunea în pubspec.yaml.')
          except Exception as e:
              # Pornit manual: o eroare trecătoare Apple nu blochează build-ul.
              if scheduled:
                  raise
              print(f'::warning::App Store Connect indisponibil ({e}); build cu versiunea din pubspec.')
              days, latest, name = -1, None, version
          print(f'pubspec: {version} | ultima aprobată: {latest} | build: {name}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"build={'true' if not scheduled or days < 21 else 'false'}\n")
              f.write(f'name={name}\n')
          PY

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Certificatul de distribuție intră într-un keychain temporar, care
      # există doar cât rulează build-ul; profilul App Store merge unde îl
      # caută Xcode.
      - name: Import signing certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISION_PROFILE_BASE64 }}
          AUTOFILL_PROFILE_BASE64: ${{ secrets.IOS_AUTOFILL_PROVISION_PROFILE_BASE64 }}
          SAFARI_PROFILE_BASE64: ${{ secrets.IOS_SAFARI_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          echo -n "$APP_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/notite.mobileprovision"
          # Extensia „Completare automată” (parolele în iOS)
          if [ -z "$AUTOFILL_PROFILE_BASE64" ]; then
            echo "::error::Lipsește secretul IOS_AUTOFILL_PROVISION_PROFILE_BASE64 (rulează set_profiles.py)."
            exit 1
          fi
          echo -n "$AUTOFILL_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/notite_autofill.mobileprovision"
          # Extensia Safari (salvarea parolelor pe site-uri)
          if [ -z "$SAFARI_PROFILE_BASE64" ]; then
            echo "::error::Lipsește secretul IOS_SAFARI_PROVISION_PROFILE_BASE64 (rulează set_profiles.py)."
            exit 1
          fi
          echo -n "$SAFARI_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/notite_safari.mobileprovision"

      # Extensia AutoFill se adaugă în proiectul Xcode aici (pe Mac), cu
      # biblioteca xcodeproj (aceeași pe care o folosește CocoaPods).
      - name: Add AutoFill and Safari extensions to the Xcode project
        run: |
          # Extensia Safari = aceeași ca extensia de Chrome (extension/),
          # cu manifestul pentru Safari.
          R=ios/SafariExtension/Resources
          mkdir -p "$R"
          cp -R extension/background.js extension/content.js             extension/popup.html extension/popup.css extension/popup.js             extension/lib extension/icons "$R/"
          cp ios/SafariExtension/manifest.safari.json "$R/manifest.json"
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/scripts/add_autofill_target.rb

      - name: Write export options plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>FUR5C9CYR8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kappado.notite</key>
              <string>Notite App Store</string>
              <key>com.kappado.notite.AutoFill</key>
              <string>Notite AutoFill AppStore</string>
              <key>com.kappado.notite.Safari</key>
              <string>Notite Safari AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # Numărul de build crește la fiecare rulare (TestFlight refuză dubluri).
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-name=${{ needs.check.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      # Fără release public: repo-ul e public, IPA-ul merge doar în TestFlight.
      # Autentificare cu cheia API (fără 2FA), deci merge fără om.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect" || true
